name: "🐛 Bug Report"
description: "File a bug report to help us improve Contradiction MCP"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.
  - type: input
    id: version
    attributes:
      label: "Contradiction MCP Version"
      description: "What version of Contradiction MCP are you using?"
      placeholder: "e.g., 0.3.3"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "MCP Host / Client"
      description: "Which client or host are you running Contradiction MCP with?"
      options:
        - "Claude Desktop"
        - "Cursor"
        - "Claude Code CLI"
        - "Gemini CLI / Antigravity"
        - "Smithery"
        - "Direct stdio / npx"
        - "Custom HTTP / SSE"
        - "Other"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: "Node.js & OS Version"
      description: "What version of Node and OS are you running?"
      placeholder: "e.g., Node v22.11.0 on macOS Sonoma / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Ingest document '...'
        2. Run scan_contradictions with params '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs & Output"
      description: "Please copy and paste any relevant terminal output, logs, or error traces."
      render: shell
